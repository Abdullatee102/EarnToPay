[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
bohr = "https://rpc.bohr.life"

[etherscan]
bohr = { key = "PLACEHOLDER", url = "https://scan.bohr.life/" }
